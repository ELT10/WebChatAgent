<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Chatbot</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="background-glow" aria-hidden="true"></div>
    <div class="container">
        <header class="app-header">
            <div class="brand">
                <span class="brand-mark"></span>
                <h1>Website Chatbot</h1>
            </div>
            <p class="subtitle">Conversational answers tailored to your site.</p>
        </header>

        <main class="panels">
            <section class="panel setup-container" id="setupContainer">
                <h2>Initialize Chatbot</h2>
                <p class="muted">Connect your website and start a chat experience instantly.</p>
                <div class="input-group">
                    <div class="field">
                        <label for="websiteUrl">Website URL</label>
                        <input type="text" id="websiteUrl" placeholder="https://example.com">
                    </div>
                    <div class="field-row">
                        <label class="checkbox">
                            <input type="checkbox" id="forceScrape">
                            <span>Force new scraping</span>
                        </label>
                        <button class="primary" onclick="initializeChatbot()">
                            <span>Initialize</span>
                        </button>
                    </div>
                </div>
            </section>

            <section class="panel chat-container" id="chatContainer" style="display: none;">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-container">
                    <input type="text" id="messageInput" placeholder="Ask anything about the site...">
                    <button class="primary" onclick="sendMessage()">Send</button>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <span>Built for clarity. Styled for focus.</span>
        </footer>

        <div class="loading-overlay" id="loadingOverlay" style="display: none;">
            <div class="loader"></div>
            <p>Processing...</p>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
